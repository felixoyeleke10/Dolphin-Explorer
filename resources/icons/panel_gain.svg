<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#aeaeb2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Axes -->
  <line x1="3" y1="20" x2="21" y2="20"/>
  <line x1="3" y1="4"  x2="3"  y2="20"/>
  <!-- Gain S-curve (low input → flat, high input → steep rise) -->
  <path d="M4,18 C7,18 8,15 12,12 C16,9 17,6 20,5"/>
  <!-- Endpoint markers -->
  <circle cx="4"  cy="18" r="1.2" fill="#aeaeb2" stroke="none"/>
  <circle cx="20" cy="5"  r="1.2" fill="#aeaeb2" stroke="none"/>
</svg>
